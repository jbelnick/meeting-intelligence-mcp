[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-intelligence-mcp"
version = "0.1.0"
description = "MCP server exposing meeting intelligence tools: summarize a transcript, extract risks, draft follow-ups."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jason Belnick" }]
dependencies = [
    "mcp>=1.9.0",
    "meeting-intelligence-pipelines @ git+https://github.com/jbelnick/meeting-intelligence-pipelines.git@4aa5388b39b082ce576157b729844a02b78a7834",
]

[project.scripts]
meeting-intelligence-mcp = "meeting_intelligence_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
